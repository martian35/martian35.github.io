<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">Permutation-aware inference</title><desc id="desc">Four input orderings are mapped to common frame coordinates. Logits are averaged before decoding over the 24 possible chronological orders.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c8e82"/></marker></defs>
<rect width="1000" height="480" fill="#f5f6f0"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#344b40">
<text id="diagram-heading" x="500" y="53" font-size="25" font-weight="600">Permutation-aware inference</text>
<text id="view-heading" x="150" y="105" font-size="14" fill="#718276">Four input views</text>
<g fill="#fff" stroke="#c4d0c0"><rect x="40" y="129" width="220" height="49" rx="7"/><rect x="40" y="189" width="220" height="49" rx="7"/><rect x="40" y="249" width="220" height="49" rx="7"/><rect x="40" y="309" width="220" height="49" rx="7"/><rect x="370" y="158" width="250" height="170" rx="10"/><rect x="730" y="158" width="230" height="170" rx="10" fill="#e7eee1"/></g>
<g font-size="18"><text id="view-1" x="150" y="160">[1, 2, 3, 4]</text><text id="view-2" x="150" y="220">[2, 1, 4, 3]</text><text id="view-3" x="150" y="280">[3, 4, 2, 1]</text><text id="view-4" x="150" y="340">[2, 3, 4, 1]</text></g>
<text id="mapping-title" x="495" y="202" font-size="20" font-weight="600">Canonical mapping</text><text id="mapping-line-1" x="495" y="245" font-size="15">Common frame identities</text><text id="mapping-line-2" x="495" y="274" font-size="15">Aligned pairwise scores</text>
<text id="average-title" x="845" y="202" font-size="20" font-weight="600">Average logits</text><text id="average-line-1" x="845" y="245" font-size="15">Aggregate the views</text><text id="average-line-2" x="845" y="274" font-size="15">Decode 24 orders</text>
<text id="diagram-footer" x="500" y="428" font-size="14" fill="#718276">One chronological prediction from multiple input orderings</text>
</g><g stroke="#7c8e82" stroke-width="2" marker-end="url(#arrow)"><path d="M277 243H349"/><path d="M638 243H708"/></g></svg>