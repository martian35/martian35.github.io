<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Random4 canonical mapping</title>
  <desc id="desc">Four display permutations are inverse mapped to absolute Input coordinates before raw-logit averaging.</desc>
  <style>
    .title{font:700 20px system-ui;fill:#172033}.label{font:600 15px system-ui;fill:#172033}
    .small{font:13px system-ui;fill:#42506a}.box{fill:#eef4ff;stroke:#4f6fae;stroke-width:1.5}
    .target{fill:#eaf8f0;stroke:#32825b;stroke-width:1.5}.arrow{stroke:#65758b;stroke-width:2;marker-end:url(#a)}
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#65758b"/></marker></defs>
  <text x="24" y="32" class="title">Production Random4 → canonical absolute coordinates</text>
  <g transform="translate(24 58)">
    <rect class="box" x="0" y="0" width="160" height="38" rx="7"/><text class="label" x="24" y="25">[1, 2, 3, 4]</text>
    <rect class="box" x="0" y="48" width="160" height="38" rx="7"/><text class="label" x="24" y="73">[2, 1, 4, 3]</text>
    <rect class="box" x="0" y="96" width="160" height="38" rx="7"/><text class="label" x="24" y="121">[3, 4, 2, 1]</text>
    <rect class="box" x="0" y="144" width="160" height="38" rx="7"/><text class="label" x="24" y="169">[2, 3, 4, 1]</text>
  </g>
  <line class="arrow" x1="205" y1="149" x2="325" y2="149"/>
  <rect class="box" x="340" y="95" width="205" height="108" rx="10"/>
  <text class="label" x="373" y="126">Inverse-map each view</text>
  <text class="small" x="363" y="153">order: relabel digit axis</text>
  <text class="small" x="363" y="177">pair: route + sign correction</text>
  <line class="arrow" x1="560" y1="149" x2="650" y2="149"/>
  <rect class="target" x="665" y="95" width="210" height="108" rx="10"/>
  <text class="label" x="695" y="126">Canonical raw-logit mean</text>
  <text class="small" x="705" y="153">absolute Input₁…Input₄</text>
  <text class="small" x="706" y="177">decode once over 24 perms</text>
</svg>
